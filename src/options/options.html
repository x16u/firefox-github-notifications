<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Einstellungen</title>
  <style>
    body { font: 14px sans-serif; padding: 16px; max-width: 400px; }
    label { display: block; margin-top: 10px; }
    input { width: 100%; box-sizing: border-box; padding: 4px; }
    button { margin-top: 14px; padding: 6px 12px; }
  </style>
</head>
<body>
  <h3>Einstellungen</h3>

  <label>
    GitHub Access Token
    <input type="text" id="githubAccesTokenString" />
  </label>

  <label>
    Abfrage-Intervall (Minuten)
    <input type="number" id="pollIntervalMinutes" min="1" />
  </label>

  <label>
    <input type="checkbox" id="notificationsEnabled" />
    Notifications aktiviert
  </label>

  <button id="save">Speichern</button>
  <span id="status"></span>

  <script src="options.js" type="module"></script>
</body>
</html>
