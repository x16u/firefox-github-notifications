<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>GitHub Notifications</title>
  <style>
    body { font: 14px sans-serif; width: 420px; padding: 10px; }
    button { width: 100%; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    button img { width: 16px; height: 16px; }
    h1,h2 { color: #555; }
    h1 { font-size: 18px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    h1 img { width: 20px; height: 20px; }
    h2 { font-size: 16px; margin-top: 20px; }
    ul { list-style: none; padding: 10px 0; margin: 0; }
    li { margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    a { text-decoration: none; color: #000; flex: 1; min-width: 0; }
    a:hover { text-decoration: underline; }
    .notification-item-mark-seen { width: auto; padding: 4px; background: none; border: none; flex-shrink: 0; }
    .notification-item-mark-seen img { width: 18px; height: 18px; display: block; }
  </style>
</head>
<body>
  <h1>GitHub Notifications <img src="../../icons/bell-ring.svg" alt="" /></h1>
  <button id="sync-now"><img src="../../icons/refresh-ccw.svg" alt="" /> Synchronisieren</button>

  <!-- missed notifications (seen -> filse) -->
  <h2>Verpasste Benachrichtigungen</h2>
  <ul id="notification-list"></ul>
  <script src="popup.js" type="module"></script>
</body>
</html>
